[package]
name = "fotoverse"
version = "0.1.0"
description = "Encuentra duplicados en tu biblioteca de fotos y vídeos"
authors = ["Alejandro Huerta <ahuertam@yahoo.es>"]
edition = "2021"
rust-version = "1.75"

# Ver más claves y definiciones en https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# El sufijo `_lib` parece redundante pero es necesario para hacer único
# el nombre de la lib y no chocar con el bin (issue sólo en Windows).
# Ver https://github.com/rust-lang/cargo/issues/8519
name = "fotoverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri runtime + plugins
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"

# Serialización
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging estructurado (Fase 1)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime (viene re-exportado por Tauri, pero tokio-util lo necesitamos
# directamente para CancellationToken)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Errores
thiserror = "1"
anyhow = "1"

# Filesystem (Fase 2)
jwalk = "0.8"
normpath = "1"
rayon = "1"

# DB (Fase 2)
rusqlite = { version = "0.32", features = ["bundled"] }

# Fechas
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Imágenes (Fase 4: thumbnails). `image` soporta JPG/PNG/GIF/BMP/TIFF/WebP
# nativamente; los GIFs animados se aplanan a su primer frame.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }

# Hashing y encoding hex para nombres de cache de thumbnails.
sha2 = "0.10"
hex = "0.4"

# Fase 8: enviar ficheros a la papelera del SO (cross-platform).
# `trash` es la opción más portable: en macOS usa Finder, en Windows
# Recycle Bin, en Linux `gio trash` o `trash-cli`. Nunca borra
# permanentemente.
trash = "5"

# Fase 5: pHash perceptual para Modo 2. Implementación propia
# (DCT 2D inline). Razón: `img_hash 0.5` requiere nightly features
# (`#![feature(hash)]`, `push_all`) y no compila con Rust 1.96;
# `img_hash 3.x` está atado a `image 0.23`, incompatible con nuestra
# `image 0.25`. Implementar pHash son ~100 líneas y nos da control
# total sobre el formato del hash.

[dev-dependencies]
# Para los tests: regenerar la fixture (jpeg+webp) y validar que
# los JPEGs cacheados decodifican.
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png"] }
