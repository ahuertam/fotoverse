# ==============================================================================
# fotoverse — CI
# ==============================================================================
# Corre en cada push y PR. Verifica que el código compila y pasa los lints
# en macOS, Windows y Linux. Linux es un bonus (Tauri no lo soporta
# oficialmente como target de release, pero Rust + TS sí compilan).
#
# En la Fase 9 se añadirá un workflow `release.yml` separado para los
# builds de distribución firmados, disparado por tags `v*`.
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancelar runs previos cuando se hace push de nuevos commits al mismo PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # ---------------------------------------------------------------------------
  # Frontend: type-check, lint, build de Vite (sin Tauri).
  # Es la parte más rápida y la que más probablemente rompa en un PR.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build (Vite)
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Backend Rust: cargo check + clippy.
  # Es lo más caro de CI (compilación de Tauri + todas sus deps nativas).
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Prerrequisitos de Tauri por OS.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # Invariante de producto: los ficheros del usuario NUNCA se borran de
      # forma permanente. db/mod.rs queda excluido porque solo borra el propio
      # fichero SQLite y sus -wal/-shm, nunca fotos ni vídeos.
      - name: Check no permanent file removal
        working-directory: src-tauri
        shell: bash
        run: |
          if grep -rn 'remove_file\|remove_dir' src/ | grep -v 'db/mod.rs'; then
            echo "::error::remove_file/remove_dir fuera de db/mod.rs rompe la promesa de papelera"
            exit 1
          fi
          echo "OK: el borrado de ficheros del usuario va solo por trash::delete_all"

  # ---------------------------------------------------------------------------
  # Audit: alertar de vulnerabilidades conocidas en deps.
  # ---------------------------------------------------------------------------
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo audit (Rust)
        uses: rustsec/audit-check@v2
        with:
          working-directory: src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (Node)
        run: pnpm audit --prod --audit-level=moderate
